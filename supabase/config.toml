# Локальная разработка; облачный проект переопределяет значения в блоке
# [remotes.production] в конце файла (`supabase config push`).
project_id = "murr-website"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Приватные аватары (Q-11): доступ только через подписанные ссылки Edge Functions.
[storage.buckets.avatars]
public = false
file_size_limit = "500KiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

# Изображения публикаций (Q-11, PUB-13): приватно, доступ — подписанные ссылки `api`.
[storage.buckets.publication-images]
public = false
file_size_limit = "1MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:4173"]
enable_signup = true
minimum_password_length = 8
# Сессия в браузере бессрочная (Q-35): access token живёт час и обновляется
# refresh token без срока действия. Ограничения [auth.sessions] (timebox,
# inactivity_timeout) намеренно не задаются.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Локальные лимиты повышены для тестов; облачные настраиваются на этапе 12.
[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_verifications = 1000

[auth.email]
# Адрес подтверждается шестизначным кодом из письма (Q-10), а не ссылкой.
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Код подтверждения Murr клан"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Код для смены пароля Murr клан"
content_path = "./supabase/templates/recovery.html"

# Resend SMTP для писем Auth. Локально выключен: письма попадают в Mailpit
# (http://127.0.0.1:54324). Чтобы проверить Resend локально, заполните
# переменные AUTH_SMTP_* в .env и поставьте enabled = true, не коммитя это
# изменение. Облачный SMTP включается в [remotes.production] (этап 12).
[auth.email.smtp]
enabled = false
host = "env(AUTH_SMTP_HOST)"
port = 465
user = "env(AUTH_SMTP_USER)"
pass = "env(AUTH_SMTP_PASS)"
admin_email = "env(AUTH_SMTP_ADMIN_EMAIL)"
sender_name = "env(AUTH_SMTP_SENDER_NAME)"

[edge_runtime]
enabled = true
# Фоновые задачи (`EdgeRuntime.waitUntil`) доделываются после ответа только
# при per_worker: обновление сообщения Telegram после ответа на сайте (TGM-21).
# Без горячей перезагрузки: после правки функции перезапустить functions serve.
policy = "per_worker"
deno_version = 2

# Единая функция прикладного API: JWT проверяет сам обработчик, потому что
# часть операций (справочник классов, проверка ника) доступна гостю.
[functions.api]
verify_jwt = false

[analytics]
enabled = false

# Облачный проект pwmurr (этап 12). Значения выше действуют и в облаке, кроме
# переопределённых здесь. Секретов в блоке нет: пароль SMTP берётся из env().
# Перед `npx supabase config push` смотреть `npx supabase config diff`.
[remotes.production]
project_id = "fbhndmsmusbqntdymnaz"

[remotes.production.auth]
site_url = "https://pwmurr.ru"
additional_redirect_urls = []

[remotes.production.auth.email]
max_frequency = "60s"

# Облачные значения Supabase по умолчанию вместо повышенных для тестов.
[remotes.production.auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30

# Resend (этап 12). Без своего SMTP Free не даёт менять шаблоны писем, и
# `config push` отклоняется целиком. Перед push заполнить AUTH_SMTP_* в .env.
[remotes.production.auth.email.smtp]
enabled = true
