<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Смена пароля</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #090909;
      color: #f3ead7;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #090909"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              background: #15130f;
              border: 1px solid #51442f;
              border-radius: 16px;
            "
          >
            <tr>
              <td style="padding: 28px 24px">
                <p
                  style="
                    margin: 0 0 6px;
                    color: #d6b56d;
                    font-size: 12px;
                    letter-spacing: 0.2em;
                    text-transform: uppercase;
                    font-weight: bold;
                  "
                >
                  Murr клан
                </p>
                <h1 style="margin: 0 0 14px; font-size: 22px; color: #f3ead7">
                  Смена пароля
                </h1>
                <p
                  style="
                    margin: 0 0 20px;
                    color: #b8ad98;
                    font-size: 15px;
                    line-height: 1.5;
                  "
                >
                  Введите этот код на сайте вместе с новым паролем.
                </p>
                <p
                  style="
                    margin: 0 0 20px;
                    padding: 16px;
                    border: 1px solid #8b7048;
                    border-radius: 12px;
                    background: #0d0c09;
                    text-align: center;
                    font-size: 32px;
                    letter-spacing: 0.35em;
                    font-weight: bold;
                    color: #e0c176;
                  "
                >
                  {{ .Token }}
                </p>
                <p
                  style="
                    margin: 0;
                    color: #8f8676;
                    font-size: 13px;
                    line-height: 1.5;
                  "
                >
                  Код действует 1 час. Если вы не запрашивали письмо, просто
                  проигнорируйте его.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
